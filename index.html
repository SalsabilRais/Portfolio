    :root {
      --bg-dark: #121212;
      --bg-card: #1e1e1f;

      --border-color: #383838;
      --text-white: #fafafa;
      --text-light: #d6d6d6;
      --text-muted: #9f9f9f;
      --accent: #ffdb70;
      --accent-dim: rgba(255, 219, 112, 0.14);
      --shadow: 0 16px 30px rgba(0, 0, 0, 0.35);
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    /* THEMES PERSONNALISABLES */
    body.theme-cyan {
      --accent: #38bdf8;
      --accent-dim: rgba(56, 189, 248, 0.14);
    }
    body.theme-emerald {
      --accent: #10b981;
      --accent-dim: rgba(16, 185, 129, 0.14);
    }
    body.theme-light {
      --bg-dark: #f1f5f9;
      --bg-card: #ffffff;
      --bg-card-inner: #f8fafc;
      --border-color: #cbd5e1;
      --text-white: #0f172a;
      --text-light: #334155;
      --text-muted: #64748b;
      --accent: #d97706;
      --accent-dim: rgba(217, 119, 6, 0.12);
      --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      line-height: 1.65;
      padding: 35px 20px;
      transition: background 0.3s, color 0.3s;
    }

    .main-wrapper {
      max-width: 1220px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 295px 1fr;
      gap: 25px;
      align-items: start;
    }

    /* --- SIDEBAR --- */
    .sidebar {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 28px 22px;
      position: sticky;
      top: 25px;
      box-shadow: var(--shadow);
      text-align: center;
      transition: background 0.3s, border 0.3s;
    }

    .avatar-box {
      width: 140px;
      height: 140px;
      margin: 0 auto 16px;
      border-radius: 26px;
      overflow: hidden;
      background: var(--bg-card-inner);
      border: 2px solid var(--accent);
    }

    .avatar-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    .name {
      color: var(--text-white);
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .role-badge {
      display: inline-block;
      background: var(--bg-card-inner);
      border: 1px solid var(--border-color);
      color: var(--text-white);
      font-size: 0.77rem;
      padding: 5px 14px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .pfe-badge {
      display: inline-block;
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid var(--accent);
      font-size: 0.72rem;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .divider {
      height: 1px;
      background: var(--border-color);
      margin: 16px 0;
    }

    .contact-list {
      list-style: none;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .icon-box {
      width: 40px;
      height: 40px;
      min-width: 40px;
      border-radius: 12px;
      background: var(--bg-card-inner);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 1.15rem;
    }

    .contact-info span {
      display: block;
      font-size: 0.68rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

      color: var(--text-white);
      font-size: 0.81rem;
      text-decoration: none;
      word-break: break-all;
    }
